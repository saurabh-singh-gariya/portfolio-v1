<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Saurabh Singh Gariya — Full Stack Engineer building React front-ends and Node.js/NestJS microservices."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Saurabh Singh Gariya — Full Stack Engineer</title>

    <!-- Crawlers that build link previews (LinkedIn, Slack, X) refuse relative URLs here. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Saurabh Singh Gariya" />
    <meta property="og:url" content="https://saurabh-portfolio-v1.vercel.app/" />
    <meta property="og:title" content="Saurabh Singh Gariya — Full Stack Engineer" />
    <meta
      property="og:description"
      content="Four years building React front-ends and Node.js/NestJS microservices. React · Node.js · TypeScript · Microservices."
    />
    <meta property="og:image" content="https://saurabh-portfolio-v1.vercel.app/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Saurabh Singh Gariya — Full Stack Engineer" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Saurabh Singh Gariya — Full Stack Engineer" />
    <meta
      name="twitter:description"
      content="Four years building React front-ends and Node.js/NestJS microservices."
    />
    <meta name="twitter:image" content="https://saurabh-portfolio-v1.vercel.app/og.png" />
    <script>
      // Runs before first paint so the stored theme never flashes the wrong colours.
      // Light is the default; dark is opt-in via the toggle.
      (function () {
        document.documentElement.classList.toggle('dark', localStorage.getItem('theme') === 'dark');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
