<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="description"
      content="Saurabh Singh Gariya — Full Stack Engineer building React front-ends and Node.js/NestJS microservices."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>Saurabh Singh Gariya — Full Stack Engineer</title>
    <script>
      // Runs before first paint so the stored theme never flashes the wrong colours.
      (function () {
        var stored = localStorage.getItem('theme');
        var dark = stored ? stored === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
        document.documentElement.classList.toggle('dark', dark);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
